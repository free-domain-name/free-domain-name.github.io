# Weekly leaderboard digest for the Free Domain Name registry.
#
# What it does
#   Reads the registry's public reviews/index.json, builds a short markdown
#   digest of the rolling seven days, and posts it once a week.
#
# Where it posts, and why
#   The preferred target is a Discussion in free-domain-name/registry
#   (POST /repos/free-domain-name/registry/discussions). That endpoint needs a
#   token with "discussions: write" on the registry, and the automatic
#   GITHUB_TOKEN of a workflow running in this repository cannot have it: the
#   token is scoped to free-domain-name/free-domain-name.github.io, and
#   Discussions are disabled on this repository, so the endpoint answers 404
#   for that token either way.
#
#   The automatic token does carry "issues: write" for its own repository, so
#   the digest is posted as an issue in THIS repository. That is the route
#   that works with the automatic token and no extra setup, and it is the
#   documented choice for this workflow.
#
#   Optional upgrade: add a repository secret named REGISTRY_TOKEN (a
#   fine-grained personal access token with "Discussions: write" on
#   free-domain-name/registry). The workflow then posts the same digest as a
#   Discussion in the registry's "General" category, and falls back to the
#   issue here when that post is rejected.
#
# Guarantees
#   - A missing token, a refused API call or an unreadable index logs a clear
#     message and exits 0. This workflow never fails the repository.
#   - At most one digest per ISO week: the schedule fires weekly, and every
#     body carries a <!-- fdn-weekly-digest:YYYY-Www --> marker that is
#     checked for before anything is posted.
#   - The digest is assembled mechanically from the public index: names,
#     counts, percentages and links only. No review or comment is written, and
#     the "opinions, not audits" framing is kept.

name: Weekly digest

on:
  schedule:
    # Mondays, 09:17 UTC.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week label for the digest (YYYY-Www). Empty means the current week."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  discussions: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

env:
  REGISTRY_REPO: free-domain-name/registry
  INDEX_URL: https://raw.githubusercontent.com/free-domain-name/registry/main/reviews/index.json

jobs:
  digest:
    name: Build and post the weekly digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Resolve the digest week
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
        run: |
          set -uo pipefail
          week="${REQUESTED_WEEK:-}"
          if [ -z "$week" ]; then
            week="$(date -u +%G-W%V)"
          elif ! printf '%s' "$week" | grep -Eq '^[0-9]{4}-W[0-9]{2}$'; then
            echo "::warning::Ignoring the invalid week label '$week'; using the current ISO week."
            week="$(date -u +%G-W%V)"
          fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "Digest week: $week"

      - name: Fetch the public review index
        id: fetch
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 60 "$INDEX_URL" -o index.json; then
            echo "::warning::Could not fetch the public review index; no digest was posted this week."
            exit 1
          fi
          echo "Fetched the public review index."

      - name: Build the digest
        id: build
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -uo pipefail
          if ! python3 scripts/weekly-digest.py --index index.json --week "$WEEK" --out digest.md --title-out digest-title.txt; then
            echo "::warning::Could not build the digest; nothing was posted this week."
            exit 1
          fi
          echo "::notice::Digest body built for $WEEK."

      - name: Check for a digest that already went out this week
        id: guard
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -uo pipefail
          marker="fdn-weekly-digest:${WEEK}"
          found=0

          issues="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | ((.body // "") + "\n" + (.title // ""))' 2>/dev/null || true)"
          if [[ "$issues" == *"$marker"* ]]; then
            found=1
            echo "::notice::A digest for ${WEEK} already exists as an issue in ${GITHUB_REPOSITORY}; skipping."
          fi

          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            threads="$(GH_TOKEN="$REGISTRY_TOKEN" gh api --paginate "repos/${REGISTRY_REPO}/discussions?per_page=100" --jq '.[] | ((.body // "") + "\n" + (.title // ""))' 2>/dev/null || true)"
            if [[ "$threads" == *"$marker"* ]]; then
              found=1
              echo "::notice::A digest for ${WEEK} already exists as a discussion in ${REGISTRY_REPO}; skipping."
            fi
          fi

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Post the digest
        id: post
        if: steps.build.outcome == 'success' && steps.guard.outputs.found != '1'
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -s digest.md ]; then
            echo "::warning::No digest body was built; nothing was posted."
            exit 0
          fi
          body="$(cat digest.md)"
          title="$(head -n 1 digest-title.txt | sed -e 's/[[:space:]]*$//')"
          posted=""

          # Preferred route: a Discussion in the registry. The automatic token
          # cannot write there, so this only succeeds with REGISTRY_TOKEN.
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            token="$REGISTRY_TOKEN"
          else
            token="${GH_TOKEN:-}"
          fi
          category_id="$(GH_TOKEN="$token" gh api "repos/${REGISTRY_REPO}/discussions/categories" --jq '[.[] | select(.name == "General") | .id][0] // empty' 2>/dev/null | head -n 1 || true)"
          if [ -z "$category_id" ]; then
            category_id="$(GH_TOKEN="$token" gh api "repos/${REGISTRY_REPO}/discussions/categories" --jq '.[0].id // empty' 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$category_id" ]; then
            category_id="53213533"
          fi
          if GH_TOKEN="$token" gh api --method POST "repos/${REGISTRY_REPO}/discussions" -f title="$title" -f body="$body" -F category_id="$category_id" >/dev/null 2>&1; then
            posted="discussion in ${REGISTRY_REPO}"
          else
            echo "::notice::The registry discussions API refused this post; falling back to an issue in ${GITHUB_REPOSITORY}."
          fi

          # Fallback route: an issue in this repository, which the automatic
          # token can always write.
          if [ -z "$posted" ]; then
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null 2>&1; then
              posted="issue in ${GITHUB_REPOSITORY}"
            else
              echo "::warning::Could not post the weekly digest. Nothing else failed and the registry was left untouched."
              echo "posted=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "posted=$posted" >> "$GITHUB_OUTPUT"
          echo "::notice::Weekly digest posted as a $posted."

      - name: Summary
        if: always()
        env:
          WEEK: ${{ steps.week.outputs.week }}
          POSTED: ${{ steps.post.outputs.posted }}
          FOUND: ${{ steps.guard.outputs.found }}
        run: |
          {
            echo "### Weekly digest"
            echo ""
            echo "- Week: \`${WEEK:-unknown}\`"
            echo "- Posted: \`${POSTED:-no}\`"
            if [ "${FOUND:-0}" = "1" ]; then
              echo "- Result: a digest for this week already existed, so nothing new was posted."
            else
              echo "- Result: the digest was built from the public review index and posted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
